<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        color: #f5f7fa;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        background:
          radial-gradient(ellipse at 15% 48%, rgba(0, 215, 232, .15), transparent 39%),
          radial-gradient(ellipse at 85% 13%, rgba(240, 42, 152, .12), transparent 36%),
          #080b11;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(91, 122, 137, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(91, 122, 137, .12) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(90deg, black, transparent 86%);
      }
      .card { position: relative; display: flex; align-items: center; width: 1200px; height: 630px; padding: 64px 76px; }
      .art { position: relative; flex: 0 0 440px; height: 500px; display: grid; place-items: center; }
      .glass {
        position: relative; width: 314px; height: 400px; overflow: hidden; border-radius: 42% 42% 35% 35%;
        border: 1px solid rgba(83, 191, 212, .46);
        background: radial-gradient(ellipse at 50% 52%, rgba(10, 19, 34, .7), rgba(5, 10, 18, .96) 70%);
        box-shadow: 0 0 78px rgba(0, 215, 232, .19), inset 0 0 58px rgba(0, 215, 232, .08);
      }
      .tube { position: absolute; left: 50%; top: 15%; width: 156px; height: 68%; transform: translateX(-50%); border-radius: 50%; border: 2px solid rgba(8, 214, 232, .75); box-shadow: 0 0 25px rgba(8, 214, 232, .3), inset 0 0 18px rgba(8, 214, 232, .15); }
      .tube:before, .tube:after { content:""; position:absolute; left:50%; top:8%; width:4px; height:84%; transform:translateX(-50%); background:linear-gradient(transparent,#06D7E8 35%,#F02A98 53%,#06D7E8 69%,transparent); filter:drop-shadow(0 0 10px #06d7e8); }
      .tube:after { width:96px; height:96px; top:43%; border-radius:50%; border:1px solid rgba(240,42,152,.84); background:radial-gradient(circle,rgba(240,42,152,.45),rgba(8,213,228,.1) 65%,transparent 70%); box-shadow:0 0 38px rgba(240,42,152,.38); }
      .orbit { position:absolute; inset:18% -11%; border:1px solid rgba(8,213,228,.42); border-radius:50%; transform:rotate(-29deg); }
      .orbit.two { inset:23% -10%; border-color:rgba(240,42,152,.45); transform:rotate(31deg); }
      .code { position:absolute; bottom:16px; left:10px; font:600 13px "Space Grotesk",sans-serif; letter-spacing:3px; color:rgba(216,239,245,.75); }
      .copy { flex: 1; padding-right: 24px; }
      .brand { display:inline-flex; align-items:center; gap:12px; margin-bottom:34px; color:#c7d0db; font-size:15px; letter-spacing:1px; }
      .mark { width:40px; height:40px; border:1px solid rgba(8,213,228,.45); border-radius:13px; display:grid; place-items:center; color:#09d5e4; font:700 18px "Space Grotesk",sans-serif; }
      .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:8px 14px; border:1px solid rgba(8,213,228,.24); border-radius:99px; color:#98a6b6; font-size:14px; }
      .dot { width:7px;height:7px;border-radius:50%;background:#09d5e4;box-shadow:0 0 14px #09d5e4; }
      h1 { margin:26px 0 16px; font-size:61px; line-height:1.22; letter-spacing:-1.8px; font-weight:700; }
      h1 strong { color:#08d5e4; font-weight:700; }
      h1 em { color:#f02a98; font-style:normal; }
      p { margin:0; max-width:610px; color:#9aa7b5; font-size:19px; line-height:1.8; }
      .rule { display:flex; align-items:center; gap:12px; margin-top:31px; font-size:13px; letter-spacing:2px; color:#5d6c7a; }
      .rule i { width:5px;height:5px;border-radius:50%;background:#f02a98; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <main class="card">
      <div class="art" aria-hidden="true">
        <div class="glass"><div class="tube"></div><div class="orbit"></div><div class="orbit two"></div></div>
        <div class="code">NUCLEAR CHEMISTRY · 01</div>
      </div>
      <div class="copy">
        <div class="brand"><span class="mark">م</span> مركز المعرفة النووية</div>
        <div class="eyebrow"><span class="dot"></span> دورات أونلاين لطلاب السعودية والخليج</div>
        <h1>الكيمياء النووية<br /><strong>بوضوح</strong> و<em>بعمق</em> حقيقي.</h1>
        <p>تعلّم التفاعلات والنظائر والمفاعلات والسلامة الإشعاعية مع المهندس محمود إسماعيل شلتوت.</p>
        <div class="rule">فهم علمي يبدأ من الجذر <i></i> تجربة تعليمية واضحة</div>
      </div>
    </main>
  </body>
</html>
